<div class="mw" id="w1">

<div class="hd"><p class="kick">Mechanics · example</p><h3>The same 3x, with and without a loan</h3>
<p class="sub" data-sub></p></div>
<div class="body">
 <div class="seg" role="tablist"><button type="button" data-v="cex" aria-pressed="true">On an exchange</button><button type="button" data-v="hylo" aria-pressed="false">In Hylo</button></div>
 <div class="p1-lg"><span><i style="background:var(--stable)"></i><b data-l1></b></span><span><i style="background:var(--accent)"></i><b data-l2></b></span></div>

<p class="note">Simplified example with no fees or rebalancing. In the real protocol leverage floats: about 2.3x after the rise, about 4.3x after the fall.</p>

<script>
(function(){
var D={
